<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link
			rel="preload"
			as="image"
			href="%sveltekit.assets%/mark/aeon-mark-1500.webp"
			imagesrcset="%sveltekit.assets%/mark/aeon-mark-750.webp 750w, %sveltekit.assets%/mark/aeon-mark-1500.webp 1500w"
			imagesizes="(max-width: 720px) 100vw, 56vw"
			type="image/webp"
			fetchpriority="high"
		/>
		<!-- ?v= is the icon's generation: browsers hold favicons past any cache header, so a new
		     exposure needs a new URL. Bump it whenever static/favicon.* is regenerated. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png?v=2" type="image/png" sizes="32x32" />
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon-192.png?v=2"
			type="image/png"
			sizes="192x192"
		/>
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png?v=2"
			sizes="180x180"
		/>
		<meta name="theme-color" content="#1a1b2f" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
